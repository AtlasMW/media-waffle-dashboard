<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client Dashboard | Media Waffle</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
:root {
  --bg: #f5f0e8; --card: #ffffff; --dark: #3b3b3b; --dark-light: #5a5a5a;
  --beige: #ddd5c4; --beige-light: #eee8dc; --accent: #c4a882; --accent-light: #e8d5b8;
  --teal: #5b9ea6; --teal-light: #e8f4f5; --coral: #c47a6c; --coral-light: #f5e8e5;
  --green: #6ba378; --green-light: #e8f5eb; --fb-blue: #1877F2; --ig-purple: #ba1fe4;
  --sidebar-w: 240px; --radius: 12px;
  --shadow: 0 1px 3px rgba(59,59,59,0.06), 0 1px 2px rgba(59,59,59,0.04);
  --shadow-hover: 0 4px 12px rgba(59,59,59,0.1);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Montserrat', sans-serif; background: var(--bg); color: var(--dark); min-height: 100vh; display: flex; }

.sidebar { width: var(--sidebar-w); background: var(--card); border-right: 1px solid var(--beige); position: fixed; top: 0; left: 0; bottom: 0; display: flex; flex-direction: column; z-index: 40; }
.sidebar-logo { padding: 24px 24px 20px; border-bottom: 1px solid var(--beige); }
.logo-text { font-weight: 700; font-size: 15px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--dark); }
.logo-sub { font-size: 10px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent); margin-top: 4px; }
.sidebar-nav { padding: 16px 12px; flex: 1; }
.nav-label { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #aaa; padding: 12px 12px 6px; }
.nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 8px; font-size: 14px; font-weight: 500; color: var(--dark-light); cursor: pointer; transition: all 0.2s; margin-bottom: 2px; }
.nav-item:hover { background: var(--beige-light); color: var(--dark); }
.nav-item.active { background: var(--dark); color: white; }
.nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
.nav-item.active svg path, .nav-item.active svg rect, .nav-item.active svg circle, .nav-item.active svg polyline, .nav-item.active svg line { stroke: white; }
.sidebar-footer { padding: 16px 12px; border-top: 1px solid var(--beige); }
.sidebar-client { font-size: 11px; color: #999; font-weight: 500; }
.sidebar-updated { font-size: 10px; color: #bbb; margin-top: 4px; }

.main { margin-left: var(--sidebar-w); flex: 1; min-height: 100vh; }
.topbar { padding: 20px 32px; display: flex; align-items: center; justify-content: space-between; background: var(--card); border-bottom: 1px solid var(--beige); position: sticky; top: 0; z-index: 30; }
.topbar-left h1 { font-family: Georgia, serif; font-size: 22px; font-weight: 700; }
.topbar-left p { font-size: 13px; color: #999; margin-top: 2px; }
.topbar-right { display: flex; align-items: center; gap: 12px; }
.date-selector { display: flex; align-items: center; background: var(--beige-light); border-radius: 8px; overflow: visible; position: relative; }
.date-btn { padding: 8px 16px; font-family: inherit; font-size: 12px; font-weight: 600; border: none; background: none; color: var(--dark-light); cursor: pointer; transition: all 0.2s; }
.date-btn.active { background: var(--dark); color: white; }
.date-btn:hover:not(.active) { background: var(--beige); }
.custom-range-wrap { position: relative; }
.custom-range-popup { display: none; position: absolute; top: calc(100% + 8px); right: 0; background: var(--card); border-radius: 10px; box-shadow: var(--shadow-hover); padding: 16px; z-index: 100; min-width: 260px; }
.custom-range-popup.open { display: block; }
.custom-range-popup label { font-size: 11px; font-weight: 600; color: #999; text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 4px; }
.custom-range-popup input[type="date"] { width: 100%; padding: 8px 10px; border: 1px solid var(--beige); border-radius: 6px; font-family: 'Montserrat', sans-serif; font-size: 13px; color: var(--dark); margin-bottom: 12px; outline: none; cursor: pointer; }
.custom-range-popup input[type="date"]:focus { border-color: var(--accent); }
.custom-range-popup input[type="date"]::-webkit-calendar-picker-indicator { cursor: pointer; opacity: 0.6; }
.custom-range-popup input[type="date"]::-webkit-datetime-edit { cursor: pointer; }
.custom-range-popup .apply-btn { width: 100%; padding: 8px; background: var(--dark); color: white; border: none; border-radius: 6px; font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
.custom-range-popup .apply-btn:hover { opacity: 0.85; }
.month-selector { display: flex; align-items: center; gap: 4px; }
.month-selector select { padding: 8px 12px; border: 1px solid var(--beige); border-radius: 8px; font-family: inherit; font-size: 13px; font-weight: 500; color: var(--dark); background: var(--card); cursor: pointer; outline: none; }
.month-nav-btn { width: 32px; height: 32px; border: 1px solid var(--beige); border-radius: 6px; background: var(--card); color: var(--dark); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; transition: all 0.2s; }
.month-nav-btn:hover { background: var(--beige-light); border-color: var(--dark); }
.month-nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.month-nav-btn:disabled:hover { background: var(--card); border-color: var(--beige); }
.export-btn { padding: 8px 16px; border: 1px solid var(--beige); border-radius: 8px; font-family: inherit; font-size: 12px; font-weight: 600; color: var(--dark); background: var(--card); cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.2s; }
.export-btn:hover { border-color: var(--dark); background: var(--beige-light); }

.content { padding: 24px 32px 48px; }

.kpi-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; margin-bottom: 24px; }
.kpi-card { background: var(--card); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); transition: box-shadow 0.2s; }
.kpi-card:hover { box-shadow: var(--shadow-hover); }
.kpi-icon { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; font-size: 14px; font-weight: 700; }
.kpi-icon.spend { background: var(--accent-light); color: var(--accent); }
.kpi-icon.leads { background: #e8e6e3; color: var(--dark); }
.kpi-icon.responded { background: var(--teal-light); color: var(--teal); }
.kpi-icon.booked { background: #f0eaff; color: #7c6fbd; }
.kpi-icon.revenue { background: #e8f5eb; color: #6ba378; }
.kpi-icon.cpl { background: var(--green-light); color: var(--green); }
.kpi-icon.ctr { background: var(--coral-light); color: var(--coral); }
.kpi-icon.impressions { background: #f0eaff; color: #7c6fbd; }
.kpi-icon.msg { background: #e8f0ff; color: var(--fb-blue); }
.kpi-icon.conv { background: #fce8ff; color: var(--ig-purple); }
.kpi-label { font-size: 11px; font-weight: 600; color: #999; letter-spacing: 0.5px; text-transform: uppercase; }
.kpi-value { font-size: 24px; font-weight: 700; margin-top: 4px; color: var(--dark); }
.kpi-trend { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; margin-top: 6px; padding: 2px 8px; border-radius: 4px; }
.kpi-trend.up { color: var(--green); background: var(--green-light); }
.kpi-trend.down { color: var(--coral); background: var(--coral-light); }
.kpi-trend.neutral { color: #999; background: var(--beige-light); }

.chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
.chart-row.triple { grid-template-columns: 1fr 1fr 1fr; }
.chart-row.full { grid-template-columns: 1fr; }
.chart-card { background: var(--card); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); }
.chart-card h3 { font-family: Georgia, serif; font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.chart-card .chart-sub { font-size: 12px; color: #999; margin-bottom: 16px; }
.chart-container { position: relative; height: 280px; }
.chart-container.short { height: 220px; }

.ad-table { width: 100%; border-collapse: collapse; }
.ad-table th { text-align: left; font-size: 11px; font-weight: 700; color: #999; text-transform: uppercase; letter-spacing: 0.5px; padding: 10px 12px; border-bottom: 1px solid var(--beige); }
.ad-table td { padding: 14px 12px; border-bottom: 1px solid var(--beige-light); font-size: 13px; vertical-align: middle; }
.ad-table tr:last-child td { border-bottom: none; }
.ad-table tr:hover { background: var(--beige-light); }
.ad-rank { width: 28px; height: 28px; border-radius: 6px; background: var(--beige-light); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; }
.ad-rank.top { background: var(--accent-light); color: var(--accent); }
.ad-name { font-weight: 600; font-size: 13px; }
.ad-adset { font-size: 11px; color: #999; margin-top: 2px; }
.ad-metric { font-weight: 600; }
.ad-metric.best { color: var(--green); }

.lead-table { width: 100%; border-collapse: collapse; }
.lead-table th { text-align: left; font-size: 11px; font-weight: 700; color: #999; text-transform: uppercase; letter-spacing: 0.5px; padding: 10px 12px; border-bottom: 1px solid var(--beige); }
.lead-table td { padding: 12px; border-bottom: 1px solid var(--beige-light); font-size: 13px; }
.lead-table tr:hover { background: var(--beige-light); }
.status-badge { display: inline-block; padding: 3px 10px; border-radius: 4px; font-size: 11px; font-weight: 600; }
.status-badge.confirmed, .status-badge.appointmentsuccessful { background: var(--green-light); color: var(--green); }
.status-badge.noshow { background: var(--coral-light); color: var(--coral); }
.status-badge.cancelled { background: #ffeaea; color: #c0392b; }
.status-badge.followup, .status-badge.infollowup { background: var(--accent-light); color: var(--accent); }
.status-badge.nocontact { background: var(--beige-light); color: #999; }
.status-badge.yes { background: var(--green-light); color: var(--green); }
.status-badge.appointmentbooked { background: var(--teal-light); color: var(--teal); }

.tab-content { display: none; }
.tab-content.active { display: block; }

.offer-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
.offer-card { background: var(--beige-light); border-radius: 10px; padding: 20px; }
.offer-card h4 { font-size: 14px; font-weight: 700; margin-bottom: 12px; }
.offer-stat { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; }
.offer-stat .label { color: #999; font-weight: 500; }
.offer-stat .value { font-weight: 700; }

.range-label { font-size: 12px; color: #999; font-weight: 500; margin-bottom: 4px; text-align: center; }

.mobile-tabs { display: none; background: var(--card); border-bottom: 1px solid var(--beige); padding: 8px 12px; gap: 4px; position: sticky; top: 0; z-index: 35; }
.mobile-tab { flex: 1; padding: 10px 8px; border: none; background: var(--beige-light); border-radius: 8px; font-family: inherit; font-size: 12px; font-weight: 600; color: var(--dark-light); cursor: pointer; transition: all 0.2s; }
.mobile-tab.active { background: var(--dark); color: white; }

@media (max-width: 1200px) { .kpi-grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 1400px) and (min-width: 1201px) { .kpi-grid { grid-template-columns: repeat(5, 1fr); } }
@media (max-width: 900px) {
  .sidebar { display: none; }
  .main { margin-left: 0; }
  .mobile-tabs { display: flex; }
  .topbar { position: static; }
  .kpi-grid { grid-template-columns: repeat(2, 1fr); }
  .chart-row, .chart-row.triple { grid-template-columns: 1fr; }
  .content { padding: 16px; }
  .topbar { padding: 16px; flex-direction: column; align-items: stretch; gap: 12px; }
  .topbar-left { text-align: center; }
  .topbar-left h1 { font-size: 18px; }
  .topbar-right { flex-wrap: wrap; justify-content: center; gap: 8px; }
  .month-selector { justify-content: center; }
  .date-selector { justify-content: center; }
  .export-btn { justify-content: center; width: 100%; }
  .ad-table { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .lead-table { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .offer-grid { grid-template-columns: 1fr; }
  .custom-range-popup { right: auto; left: 50%; transform: translateX(-50%); }
}
@media (max-width: 480px) {
  .kpi-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
  .kpi-card { padding: 14px; }
  .kpi-value { font-size: 18px; }
  .kpi-label { font-size: 10px; }
  .kpi-icon { width: 28px; height: 28px; font-size: 11px; margin-bottom: 8px; }
  .content { padding: 10px; }
  .topbar { padding: 12px; }
  .topbar-left h1 { font-size: 16px; }
  .topbar-left p { font-size: 11px; }
  .chart-card { padding: 14px; }
  .chart-card h3 { font-size: 13px; }
  .chart-card .chart-sub { font-size: 11px; margin-bottom: 10px; }
  .chart-container { height: 200px; }
  .chart-container.short { height: 170px; }
  .chart-row { gap: 10px; margin-bottom: 10px; }
  .date-btn { padding: 6px 10px; font-size: 11px; }
  .month-selector select { font-size: 12px; padding: 6px 8px; }
  .month-nav-btn { width: 28px; height: 28px; font-size: 12px; }
  /* Ad table mobile: card-style layout */
  .ad-table, .ad-table thead, .ad-table tbody, .ad-table th, .ad-table td, .ad-table tr { display: block; }
  .ad-table thead { display: none; }
  .ad-table tr { background: var(--card); border: 1px solid var(--beige-light); border-radius: 8px; padding: 12px; margin-bottom: 8px; }
  .ad-table td { padding: 4px 0; border: none; font-size: 12px; display: flex; justify-content: space-between; }
  .ad-table td:before { font-weight: 600; color: #999; font-size: 11px; text-transform: uppercase; }
  .ad-rank { display: inline-flex; }
  .ad-name { font-size: 12px; }
  .ad-adset { font-size: 10px; }
  /* Lead table mobile: card-style layout */
  .lead-table, .lead-table thead, .lead-table tbody, .lead-table th, .lead-table td, .lead-table tr { display: block; }
  .lead-table thead { display: none; }
  .lead-table tr { background: var(--card); border: 1px solid var(--beige-light); border-radius: 8px; padding: 12px; margin-bottom: 8px; }
  .lead-table td { padding: 3px 0; border: none; font-size: 12px; }
  /* Offer cards */
  .offer-grid { gap: 10px; }
  .offer-card { padding: 14px; }
  .offer-card h4 { font-size: 13px; margin-bottom: 8px; }
  .offer-stat { font-size: 12px; padding: 4px 0; }
  /* Period summary grid */
  .period-summary-grid { grid-template-columns: 1fr 1fr !important; gap: 12px !important; }
  .period-summary-grid div div:last-child { font-size: 22px !important; }
}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-text">Media Waffle</div>
    <div class="logo-sub">Client Dashboard</div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-label">Reporting</div>
    <div class="nav-item active" onclick="switchTab('overview', this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Overview
    </div>
    <div class="nav-item" onclick="switchTab('ads', this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V10"/><path d="M18 20V4"/><path d="M6 20v-4"/></svg>
      Ad Performance
    </div>
    <div class="nav-item" onclick="switchTab('leads', this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Lead Data
    </div>
    <div class="nav-item" onclick="switchTab('roi', this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      ROI
    </div>
  </nav>
  <div class="sidebar-footer">
    <div class="sidebar-client" id="sidebar-client">Loading...</div>
    <div class="sidebar-updated" id="sidebar-updated">Last updated: --</div>
  </div>
</aside>

<div class="main">
  <!-- Mobile tab bar (shown only on mobile when sidebar hidden) -->
  <div class="mobile-tabs" id="mobile-tabs">
    <button class="mobile-tab active" onclick="switchTab('overview', document.querySelector('.nav-item:nth-child(2)')); setMobileTab(this)">Overview</button>
    <button class="mobile-tab" onclick="switchTab('ads', document.querySelector('.nav-item:nth-child(3)')); setMobileTab(this)">Ads</button>
    <button class="mobile-tab" onclick="switchTab('leads', document.querySelector('.nav-item:nth-child(4)')); setMobileTab(this)">Leads</button>
    <button class="mobile-tab" onclick="switchTab('roi', document.querySelector('.nav-item:nth-child(5)')); setMobileTab(this)">ROI</button>
  </div>
  <div class="topbar">
    <div class="topbar-left">
      <h1 id="client-name">Loading...</h1>
      <p id="range-subtitle">Performance Dashboard</p>
    </div>
    <div class="topbar-right">
      <div class="month-selector" id="month-selector-wrap">
        <button class="month-nav-btn" id="month-prev" onclick="navMonth(-1)">&#8592;</button>
        <select id="month-selector" onchange="changeMonth()"></select>
        <button class="month-nav-btn" id="month-next" onclick="navMonth(1)">&#8594;</button>
      </div>
      <div class="date-selector">
        <button class="date-btn" onclick="setRange('90d', this)">90D</button>
        <button class="date-btn active" onclick="setRange('monthly', this)">Monthly</button>
        <div class="custom-range-wrap">
          <button class="date-btn" id="custom-range-btn" onclick="toggleCustomRange(this)">Custom</button>
          <div class="custom-range-popup" id="custom-range-popup">
            <label>From</label>
            <input type="date" id="custom-start">
            <label>To</label>
            <input type="date" id="custom-end">
            <button class="apply-btn" onclick="applyCustomRange()">Apply</button>
          </div>
        </div>
      </div>
      <button class="export-btn" onclick="exportPDF()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Export PDF
      </button>
    </div>
  </div>

  <div class="content" id="dashboard-content">
    <div class="tab-content active" id="tab-overview"></div>
    <div class="tab-content" id="tab-ads"></div>
    <div class="tab-content" id="tab-leads"></div>
    <div class="tab-content" id="tab-roi"></div>
  </div>
</div>

<script>
let metaData=null, leadsData=null, currentTab='overview', currentMonth=null, currentRange='monthly', charts={}, customStart=null, customEnd=null;

const C = { dark:'#3b3b3b', accent:'#c4a882', teal:'#5b9ea6', coral:'#c47a6c', green:'#6ba378', purple:'#7c6fbd', beige:'#ddd5c4', beigeLight:'#eee8dc', fbBlue:'#1877F2', igPurple:'#ba1fe4' };

Chart.defaults.font.family = "'Montserrat', sans-serif";
Chart.defaults.font.size = 11;
Chart.defaults.color = '#999';
Chart.defaults.plugins.legend.labels.usePointStyle = true;
Chart.defaults.plugins.legend.labels.pointStyle = 'circle';
Chart.defaults.plugins.legend.labels.padding = 16;

async function loadData() {
  const client = new URLSearchParams(window.location.search).get('client');
  if (!client) { window.location.href = 'hub.html'; return; }
  const [mr, lr] = await Promise.all([fetch(`data/${client}/meta.json`), fetch(`data/${client}/leads.json`)]);
  metaData = await mr.json(); leadsData = await lr.json();
  document.getElementById('client-name').textContent = metaData.client;
  document.getElementById('sidebar-client').textContent = metaData.client;
  document.getElementById('sidebar-updated').textContent = 'Last updated: ' + fmtDate(metaData.lastUpdated.slice(0,10));
  populateMonths(); render();
}

function populateMonths() {
  const sel = document.getElementById('month-selector');
  // Exclude the current calendar month (incomplete data)
  const now = new Date();
  const currentMonthKey = now.toISOString().slice(0,7);
  const months = Object.keys(metaData.monthly).filter(m => m < currentMonthKey).sort().reverse();
  sel.innerHTML = months.map(m => { const [y,mo]=m.split('-').map(Number); const d=new Date(y,mo-1,1); return `<option value="${m}">${d.toLocaleDateString('en-AU',{month:'long',year:'numeric'})}</option>`; }).join('');
  currentMonth = months[0] || Object.keys(metaData.monthly).sort().reverse()[0];
  updateMonthNav();
}

function changeMonth() { currentMonth = document.getElementById('month-selector').value; updateMonthNav(); render(); }
function navMonth(dir) {
  const sel = document.getElementById('month-selector');
  const opts = Array.from(sel.options).map(o => o.value);
  const idx = opts.indexOf(sel.value);
  // opts are in reverse order (newest first), so left arrow = older = +1 index, right = newer = -1 index
  const newIdx = idx - dir;
  if (newIdx >= 0 && newIdx < opts.length) { sel.value = opts[newIdx]; changeMonth(); }
}
function updateMonthNav() {
  const sel = document.getElementById('month-selector');
  const opts = Array.from(sel.options).map(o => o.value);
  const idx = opts.indexOf(sel.value);

function fmtC(n) { return '$'+n.toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtCw(n) { return '$'+Math.round(n).toLocaleString('en-AU'); }
function fmtP(n) { return n.toFixed(2)+'%'; }
function fmtPw(n) { return Math.round(n)+'%'; }
function fmtN(n) { if(n>=1000000) return (n/1000000).toFixed(1)+'M'; if(n>=1000) return (n/1000).toFixed(1)+'K'; return n.toString(); }
// Parse YYYY-MM-DD string as LOCAL date (avoids UTC timezone shift)
function parseLocalDate(s) { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d||1); }
// Format date as dd/mm/yyyy
function fmtDate(d) { if(typeof d==='string') d=parseLocalDate(d); const dd=String(d.getDate()).padStart(2,'0'); const mm=String(d.getMonth()+1).padStart(2,'0'); return dd+'/'+mm+'/'+d.getFullYear(); }
// Short format for chart labels: dd/mm
// Short format for chart labels: "1 Feb"
function fmtDateShort(d) { if(typeof d==='string') d=parseLocalDate(d); const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return d.getDate()+' '+months[d.getMonth()]; }
// Bucket range label: "1-7 Feb" or "22-28 Feb"
function fmtBucketLabel(startDate, endDate) { const s=typeof startDate==='string'?parseLocalDate(startDate):startDate; const e=typeof endDate==='string'?parseLocalDate(endDate):endDate; const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; if(s.getMonth()===e.getMonth()) return s.getDate()+'-'+e.getDate()+' '+months[s.getMonth()]; return s.getDate()+' '+months[s.getMonth()]+' - '+e.getDate()+' '+months[e.getMonth()]; }
function prevMonth(m) { const [y,mo] = m.split('-').map(Number); const d=new Date(y, mo-2, 1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }

function trend(cur,prev,invert) {
  if(!prev&&prev!==0) return '<span class="kpi-trend neutral">--</span>';
  const ch=((cur-prev)/Math.abs(prev||1)*100).toFixed(1);
  let dir=ch>0?'up':ch<0?'down':'neutral';
  if(invert) dir=ch>0?'down':ch<0?'up':'neutral';
  const ar=ch>0?'&#8599;':ch<0?'&#8600;':'&#8594;';
  return `<span class="kpi-trend ${dir}">${ar} ${Math.abs(ch)}%</span>`;
}

function kpi(icon,label,value,trendHtml) {
  return `<div class="kpi-card"><div class="kpi-icon ${icon}"></div><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div>${trendHtml||''}</div>`;
}

function destroyCharts() { Object.values(charts).forEach(c=>c.destroy()); charts={}; }

// ===== DATE RANGE HELPERS =====
function getLastCompletedMonthEnd() {
  // Returns the last day of the most recent fully completed month
  // "Completed" = not the current calendar month
  const now = new Date();
  const endOfLastMonth = new Date(now.getFullYear(), now.getMonth(), 0); // day 0 of current month = last day of previous month
  return endOfLastMonth.toISOString().slice(0,10);
}

function getDataCeiling() {
  // The reporting ceiling: last day of the last completed month, or latest data if earlier
  const daily = metaData.daily || [];
  if (!daily.length) return null;
  const lastCompleted = getLastCompletedMonthEnd();
  const latestData = daily[daily.length - 1].date;
  return lastCompleted < latestData ? lastCompleted : latestData;
}

function getDateRange(range) {
  const daily = metaData.daily || [];
  if (!daily.length) return null;
  const ceiling = getDataCeiling();
  if (!ceiling) return null;
  if (range === 'custom' && customStart && customEnd) {
    return { start: customStart, end: customEnd, label: `${fmtDate(customStart)} - ${fmtDate(customEnd)}` };
  }
  const end = parseLocalDate(ceiling);
  let start;
  if (range === '7d') { start = new Date(end); start.setDate(start.getDate() - 6); }
  else if (range === '14d') { start = new Date(end); start.setDate(start.getDate() - 13); }
  else if (range === '90d') { start = new Date(end); start.setDate(start.getDate() - 89); }
  else { start = new Date(end); start.setDate(start.getDate() - 29); }
  const startStr = start.getFullYear()+'-'+String(start.getMonth()+1).padStart(2,'0')+'-'+String(start.getDate()).padStart(2,'0');
  return { start: startStr, end: ceiling, label: `${fmtDate(start)} - ${fmtDate(end)}` };
}

function getDailyInRange(range) {
  const dr = getDateRange(range);
  if (!dr || !metaData.daily) return [];
  return metaData.daily.filter(d => d.date >= dr.start && d.date <= dr.end);
}

function getLeadsInRange(range) {
  const dr = getDateRange(range);
  if (!dr || !leadsData.allLeads) return [];
  return leadsData.allLeads.filter(l => l.date >= dr.start && l.date <= dr.end);
}

function aggregateDaily(days) {
  const totals = { spend: 0, impressions: 0, reach: 0, leads: 0, messages: 0 };
  days.forEach(d => { totals.spend += d.spend; totals.impressions += d.impressions; totals.reach += d.reach; totals.leads += d.leads; totals.messages += d.messages; });
  totals.cpl = totals.leads > 0 ? totals.spend / totals.leads : 0;
  totals.costPerMessage = totals.messages > 0 ? totals.spend / totals.messages : 0;
  // Average the rate metrics
  const withCtr = days.filter(d => d.uniqueCtr > 0);
  totals.uniqueCtr = withCtr.length > 0 ? withCtr.reduce((s,d) => s + d.uniqueCtr, 0) / withCtr.length : 0;
  totals.cpm = days.length > 0 ? days.reduce((s,d) => s + d.cpm, 0) / days.length : 0;
  // Calculate leadConvPct as weighted average from monthly data in range
  if (metaData.monthly) {
    let totalLeadsM = 0, weightedConv = 0;
    Object.entries(metaData.monthly).forEach(([k,v]) => {
      // Check if this month overlaps with current range
      const mStart = k + '-01';
      const [y,mo] = k.split('-').map(Number);
      const mEndD = new Date(y, mo, 0);
      const mEnd = y+'-'+String(mo).padStart(2,'0')+'-'+String(mEndD.getDate()).padStart(2,'0');
      const dr = getDateRange(currentRange);
      if (dr && mStart <= dr.end && mEnd >= dr.start && v.leadConvPct) {
        weightedConv += v.leadConvPct * v.leads;
        totalLeadsM += v.leads;
      }
    });
    totals.leadConvPct = totalLeadsM > 0 ? weightedConv / totalLeadsM : 0;
  } else { totals.leadConvPct = 0; }
  return totals;
}

function aggregateLeads(leads) {
  const totals = { totalLeads: leads.length, responded: 0, noContact: 0, inFollowUp: 0, confirmed: 0, noShow: 0, cancelled: 0 };
  leads.forEach(l => {
    const r = (l.responded || '').toLowerCase();
    if (r === 'yes') totals.responded++;
    else if (r === 'no contact') totals.noContact++;
    else totals.inFollowUp++;
    const s = (l.status || '').toLowerCase();
    if (s.includes('successful') || s === 'confirmed') totals.confirmed++;
    else if (s.includes('cancelled')) totals.cancelled++;
    else if (s.includes('no show') || s.includes('no-show')) totals.noShow++;
  });
  totals.respondedPct = totals.totalLeads > 0 ? (totals.responded / totals.totalLeads * 100) : 0;
  totals.booked = totals.confirmed + totals.cancelled + totals.noShow; // all who had appointments
  totals.bookedPct = totals.totalLeads > 0 ? (totals.booked / totals.totalLeads * 100) : 0;
  totals.cancellationRate = totals.booked > 0 ? (totals.cancelled / totals.booked * 100) : 0;
  // Sum rebooked from monthly data in range
  totals.rebooked = 0;
  if (leadsData.monthly) {
    const dr = getDateRange(currentRange);
    Object.entries(leadsData.monthly).forEach(([k,v]) => {
      const mStart = k + '-01';
      const [y,mo] = k.split('-').map(Number);
      const mEndD = new Date(y, mo, 0);
      const mEnd = y+'-'+String(mo).padStart(2,'0')+'-'+String(mEndD.getDate()).padStart(2,'0');
      if (dr && mStart <= dr.end && mEnd >= dr.start && v.rebooked) {
        totals.rebooked += v.rebooked;
      }
    });
  }
  totals.rebookingRate = totals.booked > 0 ? Math.min(100, (totals.rebooked / totals.booked * 100)) : 0;
  // Sum moneyCollected from monthly data in range
  totals.moneyCollected = 0;
  if (leadsData.monthly) {
    const dr = getDateRange(currentRange);
    Object.entries(leadsData.monthly).forEach(([k,v]) => {
      const mStart = k + '-01';
      const [y,mo] = k.split('-').map(Number);
      const mEndD = new Date(y, mo, 0);
      const mEnd = y+'-'+String(mo).padStart(2,'0')+'-'+String(mEndD.getDate()).padStart(2,'0');
      if (dr && mStart <= dr.end && mEnd >= dr.start && v.moneyCollected) {
        totals.moneyCollected += v.moneyCollected;
      }
    });
  }
  return totals;
}

// ===== RENDER =====
function render() {
  destroyCharts();
  const sub = document.getElementById('range-subtitle');

  if (currentRange === 'monthly') {
    // Parse month key safely (avoid UTC timezone shift)
    const [yr, mo] = currentMonth.split('-').map(Number);
    const mStart = new Date(yr, mo - 1, 1); // 1st of month in local time
    const mEnd = new Date(yr, mo, 0); // last day of month in local time
    sub.textContent = fmtDate(mStart) + ' \u2013 ' + fmtDate(mEnd);
    const m = metaData.monthly[currentMonth], l = enrichLeadData(leadsData.monthly[currentMonth]);
    const pm = metaData.monthly[prevMonth(currentMonth)], pl = enrichLeadData(leadsData.monthly[prevMonth(currentMonth)]);
    if (currentTab === 'overview') renderOverview(m, l, pm, pl);
    else if (currentTab === 'ads') renderAds(m, pm);
    else if (currentTab === 'leads') renderLeads(l, pl, m);
    else if (currentTab === 'roi') renderROI(m, l, pm, pl);
  } else {
    const dr = getDateRange(currentRange);
    sub.textContent = dr ? dr.label : 'Performance Dashboard';
    const days = getDailyInRange(currentRange);
    const leads = getLeadsInRange(currentRange);
    const m = aggregateDaily(days);
    const l = aggregateLeads(leads);
    // For previous period comparison, shift back by the same number of days
    let numDays;
    if (currentRange === 'custom') { numDays = Math.round((parseLocalDate(dr.end) - parseLocalDate(dr.start)) / 86400000) + 1; }
    else { numDays = currentRange === '7d' ? 7 : currentRange === '14d' ? 14 : currentRange === '90d' ? 90 : 30; }
    const drPrev = getDateRange(currentRange);
    if (drPrev) {
      const prevEnd = parseLocalDate(drPrev.start);
      prevEnd.setDate(prevEnd.getDate() - 1);
      const prevStart = new Date(prevEnd);
      prevStart.setDate(prevStart.getDate() - numDays + 1);
      const prevStartStr = prevStart.toISOString().slice(0,10);
      const prevEndStr = prevEnd.toISOString().slice(0,10);
      const prevDays = (metaData.daily||[]).filter(d => d.date >= prevStartStr && d.date <= prevEndStr);
      const prevLeads = (leadsData.allLeads||[]).filter(ld => ld.date >= prevStartStr && ld.date <= prevEndStr);
      var pm = aggregateDaily(prevDays);
      var pl = aggregateLeads(prevLeads);
    }
    if (currentTab === 'overview') renderOverviewRange(m, l, pm, pl, days, leads);
    else if (currentTab === 'ads') renderAdsRange(m, pm, days);
    else if (currentTab === 'leads') renderLeadsRange(l, pl, leads, days);
    else if (currentTab === 'roi') renderROIRange(m, l, pm, pl);
  }
}

// ===== LEAD DATA ENRICHMENT =====
function enrichLeadData(l) {
  if (!l) return l;
  l.cancellationRate = l.booked > 0 ? (l.cancelled / l.booked * 100) : 0;
  if (l.rebooked === undefined) l.rebooked = 0;
  if (l.rebookingRate === undefined) l.rebookingRate = l.booked > 0 ? Math.min(100, (l.rebooked / l.booked * 100)) : 0;
  return l;
}

// ===== WEEKLY BUCKETING HELPER =====
function getWeeklyData(monthKey) {
  // Filter daily data to just the selected month, then bucket into 7-day chunks
  const daily = metaData.daily || [];
  if (!daily.length) return { labels: [], spend: [], leads: [], cpl: [] };
  const filtered = monthKey ? daily.filter(d => d.date.startsWith(monthKey)) : daily;
  if (!filtered.length) return { labels: [], spend: [], leads: [], cpl: [] };
  const weeks = [];
  for (let i = 0; i < filtered.length; i += 7) {
    const chunk = filtered.slice(i, i + 7);
    const spend = chunk.reduce((s,d) => s + d.spend, 0);
    const leads = chunk.reduce((s,d) => s + d.leads, 0);
    const cpl = leads > 0 ? spend / leads : 0;
    const label = fmtBucketLabel(chunk[0].date, chunk[chunk.length-1].date);
    weeks.push({ label, spend, leads, cpl });
  }
  return {
    labels: weeks.map(w => w.label),
    spend: weeks.map(w => w.spend),
    leads: weeks.map(w => w.leads),
    cpl: weeks.map(w => w.cpl)
  };
}

// ===== DAILY DATA FOR MONTH =====
function getMonthlyDailyData(monthKey) {
  const daily = (metaData.daily || []).filter(d => d.date.startsWith(monthKey));
  return {
    labels: daily.map(d => parseLocalDate(d.date).getDate()),
    spend: daily.map(d => d.spend),
    leads: daily.map(d => d.leads),
    cpl: daily.map(d => d.leads > 0 ? d.spend / d.leads : 0),
    days: daily
  };
}

// ===== BUCKETING FOR RANGE VIEWS =====
function bucketDays(days, bucketSize) {
  if (bucketSize <= 1) return { labels: days.map(d => fmtDateShort(d.date)), data: days };
  const buckets = [];
  for (let i = 0; i < days.length; i += bucketSize) {
    const chunk = days.slice(i, i + bucketSize);
    const spend = chunk.reduce((s,d) => s + d.spend, 0);
    const leads = chunk.reduce((s,d) => s + d.leads, 0);
    const impressions = chunk.reduce((s,d) => s + d.impressions, 0);
    const messages = chunk.reduce((s,d) => s + d.messages, 0);
    const label = fmtBucketLabel(chunk[0].date, chunk[chunk.length-1].date);
    buckets.push({ spend, leads, impressions, messages, label });
  }
  return { labels: buckets.map(b => b.label), data: buckets };
}

  const allLeads = leadsData.allLeads || [];
  const dailyLabels = mDaily.map(d => parseLocalDate(d.date).getDate());
  const dailyLeadCounts = mDaily.map(d => allLeads.filter(l => l.date === d.date).length);
  const dailySpend = mDaily.map(d => d.spend);
  charts.lt = new Chart(document.getElementById('c-lead-trend'),{type:'line',data:{
    labels:dailyLabels,
    datasets:[
      {label:'Total Leads',data:dailyLeadCounts,borderColor:C.dark,backgroundColor:'rgba(59,59,59,0.08)',fill:true,pointRadius:3,pointBackgroundColor:C.dark,pointHoverRadius:5,tension:0.3,borderWidth:2},
      {label:'Budget ($)',data:dailySpend,borderColor:C.beige,backgroundColor:'rgba(221,213,196,0.08)',fill:false,pointRadius:3,pointBackgroundColor:C.beige,pointHoverRadius:5,tension:0.3,yAxisID:'y1',borderDash:[6,4],borderWidth:2}
    ]
  },options:{responsive:true,maintainAspectRatio:false,scales:{y:{position:'left',grid:{color:'#f0ebe3'}},y1:{position:'right',grid:{display:false},ticks:{callback:v=>'$'+v}},x:dailyXAxis()}}});
}

// ===== LEAD DATA (DATE RANGE) =====
function renderLeadsRange(l,pl,leads,days) {
  const tab=document.getElementById('tab-leads');
  // Group leads by day
  const dayMap = {};
  leads.forEach(ld => { dayMap[ld.date] = (dayMap[ld.date]||0) + 1; });
  const _numD = currentRange==='custom' && customStart && customEnd ? Math.round((parseLocalDate(customEnd)-parseLocalDate(customStart))/86400000)+1 : 0; const bSize = (currentRange === '90d' || (currentRange==='custom' && _numD > 45)) ? 7 : 1;
  let dayLabels, dayLeadCounts, daySpend;
  if (bSize > 1) {
    dayLabels = []; dayLeadCounts = []; daySpend = [];
    for (let i = 0; i < days.length; i += bSize) {
      const chunk = days.slice(i, i + bSize);
      dayLabels.push(fmtBucketLabel(chunk[0].date, chunk[chunk.length-1].date));
      daySpend.push(chunk.reduce((s,d) => s + d.spend, 0));
      const startD = chunk[0].date, endD = chunk[chunk.length-1].date;
      dayLeadCounts.push(leads.filter(l => l.date >= startD && l.date <= endD).length);
    }
  } else {
    dayLabels = days.map(d => fmtDateShort(d.date));
    dayLeadCounts = days.map(d => dayMap[d.date] || 0);
    daySpend = days.map(d => d.spend);
  }

  // Build offer comparison from leads in range + meta daily spend
  const offerMap = {};
  leads.forEach(ld => {
    const o = ld.offer || 'Unknown';
    if (!offerMap[o]) offerMap[o] = { name: o, leads: 0, booked: 0 };
    offerMap[o].leads++;
    const s = (ld.status || '').toLowerCase();
    if (s.includes('successful') || s === 'confirmed' || s.includes('booked') || s.includes('cancelled') || s.includes('no show')) offerMap[o].booked++;
  });
  // Get budget per offer from the monthly data for the closest month
  const closestMonth = currentMonth || Object.keys(metaData.monthly).sort().reverse()[0];
  const mm = metaData.monthly[closestMonth];
  const offerCards = Object.values(offerMap).filter(o => o.name.toUpperCase().includes('OFFER')).map(o => {
    const metaOffer = (mm?.offers||[]).find(mo => mo.campaignPattern && o.name.toUpperCase().includes(mo.campaignPattern));
    const budget = metaOffer ? metaOffer.spend : 0;
    const cpl = o.leads > 0 && budget > 0 ? budget / o.leads : 0;
    return `<div class="offer-card"><h4>${o.name}</h4>
      <div class="offer-stat"><span class="label">Budget</span><span class="value">${fmtC(budget)}</span></div>
      <div class="offer-stat"><span class="label">Leads</span><span class="value">${o.leads}</span></div>
      <div class="offer-stat"><span class="label">CPL</span><span class="value">${cpl>0?fmtC(cpl):'--'}</span></div>
      <div class="offer-stat"><span class="label">Bookings</span><span class="value">${o.booked}</span></div>
    </div>`;
  }).join('');

  tab.innerHTML = `
    <div class="kpi-grid">
      ${kpi('leads','Total Opportunities',l.totalLeads,trend(l.totalLeads,pl?.totalLeads))}
      ${kpi('ctr','Responded %',fmtPw(l.respondedPct),trend(l.respondedPct,pl?.respondedPct))}
      ${kpi('cpl','Booked Appointments',l.booked,trend(l.booked,pl?.booked))}
      ${kpi('conv','Booking Rate',fmtPw(l.bookedPct),trend(l.bookedPct,pl?.bookedPct))}
      ${kpi('revenue','Money Collected',fmtCw(l.moneyCollected),trend(l.moneyCollected,pl?.moneyCollected))}
      ${kpi('booked','Confirmed Appointments',l.confirmed,trend(l.confirmed,pl?.confirmed))}
      ${kpi('ctr','Cancelled Appointments',l.cancelled,trend(l.cancelled,pl?.cancelled,true))}
      ${kpi('ctr','Cancellation Rate',fmtPw(l.cancellationRate||0),trend(l.cancellationRate||0,pl?.cancellationRate||0,true))}
      ${kpi('booked','Rebooked Appointments',l.rebooked||0,trend(l.rebooked||0,pl?.rebooked||0))}
      ${kpi('conv','Rebooking Rate',fmtPw(l.rebookingRate||0),trend(l.rebookingRate||0,pl?.rebookingRate||0))}
    </div>
    <div class="chart-row">
      <div class="chart-card"><h3>Lead Status Breakdown</h3><div class="chart-sub">Selected period</div><div class="chart-container"><canvas id="c-lead-donut"></canvas></div></div>
      <div class="chart-card"><h3>Daily Lead Volume vs Budget</h3><div class="chart-sub">Leads and spend per day</div><div class="chart-container"><canvas id="c-lead-trend"></canvas></div></div>
    </div>
    ${offerCards?`<div class="chart-row full"><div class="chart-card"><h3>Offer Comparison</h3><div class="chart-sub">Budget, leads, CPL, and bookings by offer</div><div class="offer-grid">${offerCards}</div></div></div>`:''}
    <div class="chart-row full"><div class="chart-card"><h3>Leads in Period</h3><div class="chart-sub">${leads.length} leads found</div>
      <table class="lead-table"><thead><tr><th>Date</th><th>Name</th><th>Offer</th><th>Responded</th><th>Status</th></tr></thead>
      <tbody>${leads.slice().reverse().slice(0,10).map(lead=>{
        const rc=(lead.responded||'').toLowerCase()==='yes'?'yes':(lead.responded||'').toLowerCase()==='no contact'?'nocontact':'infollowup';
        const sc=(lead.status||'').toLowerCase().replace(/\s/g,'');
        return `<tr><td>${fmtDate(lead.date)}</td><td style="font-weight:600;">${lead.name}</td><td>${lead.offer}</td><td><span class="status-badge ${rc}">${lead.responded}</span></td><td>${lead.status?`<span class="status-badge ${sc}">${lead.status}</span>`:'<span style="color:#ccc;">--</span>'}</td></tr>`;
      }).join('')}</tbody></table>
    </div></div>
    ${LEGEND_LEADS}`;

  const ldTotal = l.responded + l.noContact + l.inFollowUp;
  const ldPct = v => ldTotal ? (v/ldTotal*100).toFixed(1) : '0.0';
  if (ldTotal > 0) {
    charts.ld = new Chart(document.getElementById('c-lead-donut'),{type:'doughnut',data:{
      labels:[`Responded: ${l.responded} (${ldPct(l.responded)}%)`,`No Contact: ${l.noContact} (${ldPct(l.noContact)}%)`,`In Follow Up: ${l.inFollowUp} (${ldPct(l.inFollowUp)}%)`],
      datasets:[{data:[l.responded,l.noContact,l.inFollowUp],backgroundColor:[C.dark,C.beige,C.accent],borderWidth:0,hoverOffset:4}]
    },options:{responsive:true,maintainAspectRatio:false,cutout:'60%',plugins:{legend:{position:'right'}}}});
  }

  charts.lt = new Chart(document.getElementById('c-lead-trend'),{type:'line',data:{
    labels:dayLabels,
    datasets:[
      {label:'Leads',data:dayLeadCounts,borderColor:C.dark,backgroundColor:'rgba(59,59,59,0.06)',fill:true,pointRadius:3,pointBackgroundColor:C.dark,tension:0.3},
      {label:'Budget ($)',data:daySpend,borderColor:C.beige,fill:false,pointRadius:2,pointBackgroundColor:C.beige,tension:0.3,yAxisID:'y1',borderDash:[6,4]}
    ]
  },options:{responsive:true,maintainAspectRatio:false,scales:{y:{position:'left',grid:{color:'#f0ebe3'}},y1:{position:'right',grid:{display:false},ticks:{callback:v=>'$'+v}}}}});
}

// ===== ROI (MONTHLY) =====
const AGENCY_FEE = 950;
const LTV = 827;

function roiKpi(label, value) {
  return `<div class="kpi-card"><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div></div>`;
}

function renderROIContent(tab, m, l, pm, pl, numMonths) {
  const agencyFee = AGENCY_FEE * numMonths;
  const adSpend = m?.spend || 0;
  const bookings = l?.booked || 0;
  const moneyCollected = l?.moneyCollected || 0;
  const totalCost = adSpend + agencyFee;
  const ltvRevenue = bookings * LTV;
  const trueROI = totalCost > 0 ? (ltvRevenue / totalCost * 100) : 0;
  const roi = totalCost > 0 ? (moneyCollected / totalCost * 100) : 0;

  const roiColor = roi >= 100 ? 'var(--green)' : roi >= 50 ? 'var(--accent)' : 'var(--coral)';
  const trueRoiColor = trueROI >= 100 ? 'var(--green)' : trueROI >= 50 ? 'var(--accent)' : 'var(--coral)';

  tab.innerHTML = `
    <div class="kpi-grid">
      ${roiKpi('Agency Fee',fmtCw(agencyFee))}
      ${roiKpi('Ad Spend',fmtC(adSpend))}
      ${roiKpi('Total Cost',fmtC(totalCost))}
      ${roiKpi('Bookings',bookings)}
      ${roiKpi('Money Collected',fmtCw(moneyCollected))}
      ${roiKpi('LTV Revenue',fmtCw(ltvRevenue))}
    </div>

    <div class="chart-row">
      <div class="chart-card">
        <h3>Return on Investment</h3>
        <div class="chart-sub">Based on actual money collected</div>
        <div style="text-align:center;padding:30px 0;">
          <div style="font-size:48px;font-weight:700;color:${roiColor};">${roi.toFixed(1)}%</div>
          <div style="font-size:14px;color:#999;margin-top:8px;">ROI</div>
        </div>
      </div>
      <div class="chart-card">
        <h3>TRUE ROI (Projected)</h3>
        <div class="chart-sub">Based on bookings x LTV ($${LTV})</div>
        <div style="text-align:center;padding:30px 0;">
          <div style="font-size:48px;font-weight:700;color:${trueRoiColor};">${trueROI.toFixed(1)}%</div>
          <div style="font-size:14px;color:#999;margin-top:8px;">TRUE ROI</div>
        </div>
      </div>
    </div>

    <div class="chart-row full">
      <div class="chart-card">
        <h3>ROI Breakdown</h3>
        <div class="chart-sub">Cost vs revenue comparison</div>
        <div class="chart-container"><canvas id="c-roi-bar"></canvas></div>
      </div>
    </div>

    <div class="chart-row full">
      <div class="chart-card" style="background:var(--beige-light);">
        <h3 style="margin-bottom:16px;">Metric Definitions</h3>
        <div style="display:grid;gap:12px;font-size:13px;line-height:1.6;">
          <div><strong>Agency Fee:</strong> The monthly retainer paid to Media Waffle for management and strategy.</div>
          <div><strong>Ad Spend:</strong> Total amount spent on Meta (Facebook/Instagram) advertising for the period.</div>
          <div><strong>Total Cost:</strong> The combined investment: Ad Spend + Agency Fee. This is the total outlay for the period.</div>
          <div><strong>Bookings:</strong> Number of confirmed appointments.</div>
          <div><strong>Money Collected:</strong> Revenue generated from all confirmed appointments that came from leads during this period.</div>
          <div><strong>LTV (Lifetime Value):</strong> The estimated lifetime value of a customer based on average revenue data from Timely reports. Currently estimated at ~$${LTV} per client.</div>
          <div><strong>LTV Revenue:</strong> Projected total revenue: Bookings x LTV. Represents the expected long-term value of bookings made this period.</div>
          <div><strong>ROI (Return on Investment):</strong> Money Collected / Total Cost x 100. Shows actual return based on cash already received. Below 100% means you haven't recouped costs yet from collected revenue alone.</div>
          <div><strong>TRUE ROI:</strong> LTV Revenue / Total Cost x 100. Shows projected return when accounting for the full lifetime value of each booking. This is the more accurate measure of campaign profitability.</div>
        </div>
      </div>
    </div>
  `;

  // Bar chart: costs vs revenue
  charts.roiBar = new Chart(document.getElementById('c-roi-bar'),{type:'bar',data:{
    labels:['Agency Fee','Ad Spend','Total Cost','Money Collected','LTV Revenue'],
    datasets:[{
      data:[agencyFee, adSpend, totalCost, moneyCollected, ltvRevenue],
      backgroundColor:[C.accent, C.beige, C.coral, '#6ba378', '#35d45a'],
      borderRadius:6
    }]
  },options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>fmtC(ctx.raw)}}},scales:{x:{grid:{color:'#f0ebe3'},ticks:{callback:v=>'$'+v.toLocaleString()}},y:{grid:{display:false}}}}});
}

function renderROI(m, l, pm, pl) {
  renderROIContent(document.getElementById('tab-roi'), m, l, pm, pl, 1);
}

function renderROIRange(m, l, pm, pl) {
  // Count months in range
  let numMonths = 1;
  const dr = getDateRange(currentRange);
  if (dr) {
    const days = Math.round((parseLocalDate(dr.end) - parseLocalDate(dr.start)) / 86400000) + 1;
    numMonths = Math.max(1, Math.round(days / 30));
  }
  renderROIContent(document.getElementById('tab-roi'), m, l, pm, pl, numMonths);
}

// PDF
async function exportPDF() {
  const btn=document.querySelector('.export-btn'); btn.textContent='Generating...'; btn.disabled=true;
  try {
    const c=document.getElementById('dashboard-content');
    const canvas=await html2canvas(c,{scale:2,backgroundColor:'#f5f0e8',useCORS:true});
    const{jsPDF}=window.jspdf; const pdf=new jsPDF('l','mm','a4');
    const w=pdf.internal.pageSize.getWidth(), h=(canvas.height*w)/canvas.width;
    let left=h, pos=0; const pH=pdf.internal.pageSize.getHeight();
    pdf.addImage(canvas.toDataURL('image/jpeg',0.95),'JPEG',0,pos,w,h);
    left-=pH; while(left>0){pos=-(h-left);pdf.addPage();pdf.addImage(canvas.toDataURL('image/jpeg',0.95),'JPEG',0,pos,w,h);left-=pH;}
    const rangeLabel = currentRange==='monthly' ? currentMonth : currentRange==='custom' ? `${customStart} to ${customEnd}` : currentRange.toUpperCase();
    pdf.save(`${metaData.client} - ${rangeLabel}.pdf`);
  } catch(e){alert('PDF export failed.');}
  btn.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Export PDF';
  btn.disabled=false;
}

  const wrap = document.querySelector('.custom-range-wrap');
  if (wrap && !wrap.contains(e.target)) document.getElementById('custom-range-popup').classList.remove('open');
});
