<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media Waffle | Client Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f0e8;
  --card: #ffffff;
  --dark: #3b3b3b;
  --dark-light: #5a5a5a;
  --beige: #ddd5c4;
  --beige-light: #eee8dc;
  --accent: #c4a882;
  --green: #6ba378;
  --green-light: #e8f5eb;
  --coral: #c47a6c;
  --teal: #5b9ea6;
  --radius: 12px;
  --shadow: 0 1px 3px rgba(59,59,59,0.06), 0 1px 2px rgba(59,59,59,0.04);
  --shadow-hover: 0 8px 24px rgba(59,59,59,0.12);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Montserrat', sans-serif; background: var(--bg); color: var(--dark); min-height: 100vh; }

/* Header */
.header {
  background: var(--card);
  border-bottom: 1px solid var(--beige);
  padding: 24px 40px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 10;
}
.header-left { display: flex; align-items: center; gap: 16px; }
.logo-text {
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--dark);
}
.logo-divider {
  width: 1px;
  height: 24px;
  background: var(--beige);
}
.header-title {
  font-family: Georgia, serif;
  font-size: 20px;
  font-weight: 700;
  color: var(--dark);
}
.header-right {
  display: flex;
  align-items: center;
  gap: 16px;
  font-size: 13px;
  color: var(--dark-light);
}
.header-date {
  padding: 8px 16px;
  background: var(--beige-light);
  border-radius: 8px;
  font-weight: 500;
}

/* Main */
.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 100px 24px 40px;
}

/* Stats bar */
.stats-bar {
  display: flex;
  gap: 16px;
  margin-bottom: 32px;
}
.stat-card {
  flex: 1;
  background: var(--card);
  border-radius: var(--radius);
  padding: 20px 24px;
  box-shadow: var(--shadow);
}
.stat-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: #999;
  margin-bottom: 6px;
}
.stat-value {
  font-size: 28px;
  font-weight: 700;
  color: var(--dark);
}
.stat-sub {
  font-size: 12px;
  color: var(--dark-light);
  margin-top: 4px;
}

/* Section header */
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}
.section-title {
  font-family: Georgia, serif;
  font-size: 18px;
  font-weight: 700;
}
.section-count {
  font-size: 13px;
  color: #999;
  font-weight: 500;
}

/* Client grid */
.client-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 20px;
}

.client-tile {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
  transition: all 0.25s ease;
  cursor: pointer;
  position: relative;
}
.client-tile:hover {
  box-shadow: var(--shadow-hover);
  transform: translateY(-2px);
}

.tile-accent {
  height: 4px;
  background: var(--dark);
}
.tile-body {
  padding: 24px;
}
.tile-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 16px;
}
.tile-name {
  font-family: Georgia, serif;
  font-size: 17px;
  font-weight: 700;
  color: var(--dark);
  line-height: 1.3;
}
.tile-status {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  padding: 4px 10px;
  border-radius: 20px;
  white-space: nowrap;
}
.tile-status.active {
  background: var(--green-light);
  color: var(--green);
}
.tile-status.paused {
  background: #fef3e5;
  color: var(--coral);
}

.tile-metrics {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 12px;
  margin-bottom: 20px;
}
.tile-metric-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #aaa;
  margin-bottom: 2px;
}
.tile-metric-value {
  font-size: 16px;
  font-weight: 700;
  color: var(--dark);
}

.tile-actions {
  display: flex;
  gap: 10px;
  padding-top: 16px;
  border-top: 1px solid var(--beige-light);
}
.btn {
  flex: 1;
  padding: 10px 16px;
  border-radius: 8px;
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  border: none;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.btn-primary {
  background: var(--dark);
  color: white;
}
.btn-primary:hover {
  background: #2a2a2a;
}
.btn-secondary {
  background: var(--beige-light);
  color: var(--dark);
}
.btn-secondary:hover {
  background: var(--beige);
}
.btn svg {
  width: 14px;
  height: 14px;
  flex-shrink: 0;
}

/* Toast */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--dark);
  color: white;
  padding: 12px 24px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  box-shadow: 0 8px 24px rgba(0,0,0,0.2);
  transition: transform 0.3s ease;
  z-index: 100;
  pointer-events: none;
}
.toast.show {
  transform: translateX(-50%) translateY(0);
}

/* Modal */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(59,59,59,0.5);
  z-index: 200;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: 0 16px 48px rgba(0,0,0,0.2);
  width: 100%;
  max-width: 560px;
  max-height: 90vh;
  overflow-y: auto;
}
.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 24px;
  border-bottom: 1px solid var(--beige-light);
}
.modal-body { padding: 24px; }

/* Responsive */
@media (max-width: 768px) {
  .header {
    padding: 20px 16px 16px;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 10;
  }
  .container {
    padding: 130px 16px 24px;
  }
  .header-left {
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .logo-text {
    font-size: 18px;
    letter-spacing: 3px;
  }
  .logo-divider { display: none; }
  .header-title { font-size: 14px; font-weight: 600; color: var(--dark-light); }
  .header-right { width: auto; }
  .header-date { font-size: 11px; padding: 6px 12px; }
  .stats-bar { flex-wrap: wrap; }
  .stat-card { min-width: calc(50% - 8px); }
  .client-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="logo-text">MEDIA WAFFLE</div>
    <div class="logo-divider"></div>
    <div class="header-title">Client Hub</div>
  </div>
  <div class="header-right">
    <div class="header-date" id="current-date"></div>
  </div>
</div>

<div class="container">
  <div class="stats-bar" id="stats-bar"></div>

  <div class="section-header">
    <div class="section-title">Active Clients</div>
    <div class="section-count" id="client-count"></div>
  </div>
  <div class="client-grid" id="client-grid"></div>

  <div style="margin-top:40px;text-align:center;">
    <button class="btn btn-secondary" onclick="showNewClientModal()" style="padding:14px 32px;font-size:14px;border:2px dashed var(--beige);background:transparent;border-radius:var(--radius);width:100%;max-width:340px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Add New Client
    </button>
  </div>
</div>

<!-- New Client Modal -->
<div class="modal-overlay" id="new-client-modal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-header">
      <h2 style="font-family:Georgia,serif;font-size:20px;">New Client Dashboard Setup</h2>
      <button onclick="closeModal()" style="background:none;border:none;cursor:pointer;padding:4px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--dark)" stroke-width="2" style="width:20px;height:20px;"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <p style="color:var(--dark-light);margin-bottom:20px;font-size:13px;line-height:1.6;">Copy the template below, fill in the details, and send it to Atlas to set up a new client dashboard.</p>
      <textarea id="client-template" readonly style="width:100%;min-height:380px;padding:16px;font-family:'Montserrat',sans-serif;font-size:12px;line-height:1.8;border:1px solid var(--beige);border-radius:8px;background:var(--beige-light);color:var(--dark);resize:vertical;">NEW CLIENT DASHBOARD REQUEST

Client name:
Dashboard slug (short lowercase identifier, e.g. "vernalys"):
Meta Ad Account ID (format: act_XXXXXXXXXX):
Google Sheet ID (the long string from the sheet URL):
Lead Data tab name (e.g. "Lead Data 2025" or "Lead Data 2026"):
First month of ad data (e.g. July 2025):
Ad account currency (AUD or USD):
Agency fee per month ($):
Fee start date (if different from first month):
Any fee changes over time (e.g. "$800 for first 3 months, then $1,000"):

OPTIONAL
Offer/campaign names:
GHL Location ID (if not already configured):
GHL API Key (if not already configured):
LTV per client ($):
Any notes:</textarea>
      <div style="display:flex;gap:10px;margin-top:16px;">
        <button class="btn btn-primary" onclick="copyTemplate()" style="flex:1;padding:12px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
          Copy Template
        </button>
        <button class="btn btn-secondary" onclick="closeModal()" style="flex:1;padding:12px;">Close</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast">Link copied to clipboard</div>

<script>
// ===== CLIENT REGISTRY =====
// Add new clients here. That's it.
const CLIENTS = [
  {
    slug: "vernalys",
    name: "Vernalys Skin & Laser Clinic",
    status: "active",
    startDate: "2025-07",
    fee: 950
  },
  {
    slug: "cronulla",
    name: "Cronulla Skin Sanctuary",
    status: "active",
    startDate: "2026-01",
    fee: 1500
  },
  {
    slug: "eleve",
    name: "Eleve Cosmetics",
    status: "active",
    startDate: "2025-07",
    fee: 1000
  },
  {
    slug: "rejuvia",
    name: "Rejuvia Beauty & Aesthetics",
    status: "active",
    startDate: "2025-10",
    fee: 1500
  },
  {
    slug: "hairplus",
    name: "The Hair Plus Clinic",
    status: "active",
    startDate: "2026-01",
    fee: 990
  }
];

const BASE_URL = window.location.origin + window.location.pathname.replace(/hub\.html$/, '') + 'index.html';

function fmtC(v) { return '$' + Number(v).toLocaleString('en-AU', {minimumFractionDigits: 0, maximumFractionDigits: 0}); }
function fmtCd(v) { return '$' + Number(v).toLocaleString('en-AU', {minimumFractionDigits: 2, maximumFractionDigits: 2}); }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function showNewClientModal() {
  document.getElementById('new-client-modal').classList.add('open');
}
function closeModal() {
  document.getElementById('new-client-modal').classList.remove('open');
}
function copyTemplate() {
  const ta = document.getElementById('client-template');
  navigator.clipboard.writeText(ta.value).then(() => {
    showToast('Template copied to clipboard');
  }).catch(() => {
    ta.select();
    document.execCommand('copy');
    showToast('Template copied to clipboard');
  });
}

function copyLink(slug, e) {
  e.stopPropagation();
  const url = BASE_URL + '?client=' + slug;
  navigator.clipboard.writeText(url).then(() => {
    showToast('Report link copied');
  }).catch(() => {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = url;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('Report link copied');
  });
}

function openDashboard(slug) {
  window.location.href = 'index.html?client=' + slug;
}

async function loadClientData(slug) {
  try {
    const [mr, lr] = await Promise.all([
      fetch('data/' + slug + '/meta.json'),
      fetch('data/' + slug + '/leads.json')
    ]);
    if (!mr.ok || !lr.ok) return null;
    const meta = await mr.json();
    const leads = await lr.json();
    return { meta, leads };
  } catch {
    return null;
  }
}

function getLastMonth(data) {
  if (!data || !data.meta || !data.meta.monthly) return null;
  const months = Object.keys(data.meta.monthly).sort();
  // Exclude current month
  const now = new Date();
  const currentKey = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
  const completed = months.filter(m => m < currentKey);
  return completed.length ? completed[completed.length - 1] : months[months.length - 1];
}

function getMonthName(key) {
  const [y, m] = key.split('-');
  const names = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return names[parseInt(m) - 1] + ' ' + y;
}

async function init() {
  // Set date
  const now = new Date();
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('current-date').textContent =
    now.getDate() + ' ' + months[now.getMonth()] + ' ' + now.getFullYear();

  // Load all client data in parallel
  const dataPromises = CLIENTS.map(c => loadClientData(c.slug));
  const allData = await Promise.all(dataPromises);

  // Calculate totals for stats bar
  let totalClients = CLIENTS.length;
  let totalSpend = 0;
  let totalLeads = 0;
  let totalRevenue = 0;
  let latestMonth = null;

  CLIENTS.forEach((c, i) => {
    const data = allData[i];
    if (!data) return;
    const lm = getLastMonth(data);
    if (!lm) return;
    if (!latestMonth || lm > latestMonth) latestMonth = lm;
    const mm = data.meta.monthly[lm];
    const lm2 = data.leads.monthly[lm];
    if (mm) { totalSpend += mm.spend; totalLeads += mm.leads; }
    if (lm2) { totalRevenue += lm2.moneyCollected || 0; }
  });

  // Render stats bar
  const statsHtml = `
    <div class="stat-card">
      <div class="stat-label">Active Clients</div>
      <div class="stat-value">${totalClients}</div>
      <div class="stat-sub">Managed accounts</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Total Ad Spend</div>
      <div class="stat-value">${fmtC(totalSpend)}</div>
      <div class="stat-sub">${latestMonth ? getMonthName(latestMonth) : '--'}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Total Leads</div>
      <div class="stat-value">${totalLeads}</div>
      <div class="stat-sub">${latestMonth ? getMonthName(latestMonth) : '--'}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Total Revenue</div>
      <div class="stat-value">${fmtC(totalRevenue)}</div>
      <div class="stat-sub">${latestMonth ? getMonthName(latestMonth) : '--'}</div>
    </div>
  `;
  document.getElementById('stats-bar').innerHTML = statsHtml;
  document.getElementById('client-count').textContent = totalClients + ' clients';

  // Render client tiles
  let gridHtml = '';
  CLIENTS.forEach((c, i) => {
    const data = allData[i];
    const lm = data ? getLastMonth(data) : null;
    const mm = lm && data.meta.monthly[lm] ? data.meta.monthly[lm] : null;
    const ll = lm && data.leads.monthly[lm] ? data.leads.monthly[lm] : null;

    const spend = mm ? fmtC(mm.spend) : '--';
    const leads = mm ? mm.leads : '--';
    const cpl = mm ? fmtCd(mm.cpl) : '--';
    const period = lm ? getMonthName(lm) : '--';

    gridHtml += `
      <div class="client-tile" onclick="openDashboard('${c.slug}')">
        <div class="tile-accent"></div>
        <div class="tile-body">
          <div class="tile-header">
            <div class="tile-name">${c.name}</div>
            <div class="tile-status ${c.status}">${c.status}</div>
          </div>
          <div style="font-size:11px;color:#aaa;font-weight:500;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;">${period}</div>
          <div class="tile-metrics">
            <div>
              <div class="tile-metric-label">Ad Spend</div>
              <div class="tile-metric-value">${spend}</div>
            </div>
            <div>
              <div class="tile-metric-label">Leads</div>
              <div class="tile-metric-value">${leads}</div>
            </div>
            <div>
              <div class="tile-metric-label">CPL</div>
              <div class="tile-metric-value">${cpl}</div>
            </div>
          </div>
          <div class="tile-actions">
            <a class="btn btn-primary" onclick="openDashboard('${c.slug}')" href="javascript:void(0)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
              View Dashboard
            </a>
            <button class="btn btn-secondary" onclick="copyLink('${c.slug}', event)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
              Copy Link
            </button>
          </div>
        </div>
      </div>
    `;
  });

  document.getElementById('client-grid').innerHTML = gridHtml;
}

init();
</script>
</body>
</html>
